[env:teensy41]
; everything pinned so a rebuild gives the same firmware as the one tested.
; platform 6.0.0 = teensy core 1.162.0 + its gcc toolchain.
; QNEthernet: HedgeHawk fork, branch ieee1588-2-fix, commit of 2024-03-08.
; OpenAudio: master, commit of 2026-08-18.
; to move to newer versions, change the version / commit hash here on purpose.
platform = teensy@6.0.0
board = teensy41
framework = arduino
build_flags =
    -include math.h
lib_deps =
    https://github.com/HedgeHawk/QNEthernet.git#6edbded44ee610e6e08c061dff594065cde321d2
    https://github.com/chipaudette/OpenAudio_ArduinoLibrary.git#1dbecf11ca7db700f3f25b2e8f2ed383962a684b
