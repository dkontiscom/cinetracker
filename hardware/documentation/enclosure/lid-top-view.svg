<rect x="250.9" y="486.2" width="115.2" height="63.9" fill="none" stroke="#c0392b" stroke-dasharray="3,2"/>
<text x="253.6" y="522.7" font-size="9" fill="#c0392b">T1 top z 26.2 ± 0.3</text>
<text x="20" y="905" font-size="10">Hole positions = part centres from cinetracker-carrier.kicad_pcb (D1, D2, SW1). Hole Ø3.0 is an assumption (light pipe / plunger), not a datasheet value.</text>
<text x="20" y="919" font-size="10">Lid inner face ≥ 40.5 above the carrier top (front-panel bend rule), so light pipes are ≈ 39.5 mm long (0805 LED 0.8 mm tall) and the SW1 plunger ≈ 39 mm (TS-1187A H = 1.5).</text>
<text x="20" y="933" font-size="10">Clear vertical column: a pipe centred at y 22.5 may be up to Ø4.5 before it touches the J8 socket body (y 24.75); the PoE board starts at y 26. No part above D1/D2/SW1.</text>
<text x="20" y="947" font-size="10">SW1 travel is only 0.2–0.25 mm (XKB TS-1187A drawing): a rigid 39 mm plunger needs its own spring/stop in the lid, or the stack tolerance (±1 mm) presses it permanently.</text>
<text x="20" y="961" font-size="10">Tallest items under the lid: M12 shell hex ≈ 37.8 (proxy SW15 / Toponelec 17.16 above the PoE board), M12 insert 34.6 (CAZN 14.14), PS1 28.5 ± 0.5 (SDAPO 8.0 ± 0.5).</text>
</svg>