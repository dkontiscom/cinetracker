<text x="20" y="638.0" font-size="10">Datasheet values: BNC cut-out Ø12.8/5.5 (Kinghelm KH-801-0039 p.1); M8 Ø10.1/9.1 (CAZN M8-S4A-GPL-M10-JD p.2, dosinconn DS869FPR0470-6P);</text>
<text x="20" y="652.0" font-size="10">M8 axis 6.3 (CAZN p.2); M12 axis 8.71 above the PoE board (CAZN C7423431 p.2); M8 plug Ø10 (P+F 211525); BNC plug Ø14.53 (TE 134959-1); M12-X plug Ø15.0 (Beckhoff ZK1096-8181).</text>
<text x="20" y="666.0" font-size="10">ASSUMED / SCALED: BNC axis 6.6 (scaled, not dimensioned); BNC nut 16 AF (NTE 06-B012, same 1/2-28 thread, not the Kinghelm nut); M8 nut SW11 (dosinconn; CAZN not dimensioned);</text>
<text x="20" y="680.0" font-size="10">M12 cut-out Ø12.1 and nut SW15 from the CAZN A-coded M12-S3A-GPL M12 (catalogue p.40) and Toponelec C12B (Ø12.1, D-flat 10.7): the C7423431 housing is undocumented.</text>
<text x="20" y="694.0" font-size="10">M12 height = 8.5 socket + 2.5 Teensy header plastic (assumed) + 1.57 Teensy + 2.0 ETH header plastic (assumed) + 4.3 J2 + 1.6 PoE + 8.71 = 29.18; worst-case ±1.2, RSS ±0.5.</text>
<text x="20" y="708.0" font-size="10">Panel thickness window: rear ≤ 4.5 (dosinconn, stated); front 1.5–2.5 only if the M12 housing behaves like the proxies (SUSPICION). Webs ≥ 6T (Machine Design/Protolabs rule) need T ≤ 1.8 mm (J5–J6 web 10.9).</text>
<text x="20" y="722.0" font-size="10">View from OUTSIDE the box. Front: carrier x increases to the right. All values mm. Requirements view for the enclosure designer, not a fabrication drawing.</text>
